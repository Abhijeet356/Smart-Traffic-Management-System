services:
  - type: web
    name: smart-traffic-management-system
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: AUTO_SIMULATION
        value: "true"
      - key: SIMULATION_INTERVAL_MS
        value: "10000"
      - key: MONGODB_URI
        sync: false
